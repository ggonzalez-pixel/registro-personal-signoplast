const log = document.getElementById("log");
function addLog(msg, cls="") {
  const span = document.createElement("span");
  span.className = cls;
  span.textContent = msg + "\n";
  log.appendChild(span);
  log.scrollTop = log.scrollHeight;
}

document.getElementById("btnCargar").addEventListener("click", async () => {
  const email = prompt("Tu email de admin (ej: admin@signoplast.local):");
  if(!email) return;
  const pass = prompt("Tu contraseña:");
  if(!pass) return;

  document.getElementById("btnCargar").disabled = true;
  addLog("Iniciando sesión...");

  try {
    await signInWithEmailAndPassword(auth, email, pass);
    addLog("✓ Sesión iniciada. Cargando empleados...\n", "ok");

    let ok = 0, err = 0;
    for(const emp of empleados){
      try {
        await addDoc(collection(db, "employees"), {
          ...emp, estado: "activo", temporal: false, createdAt: serverTimestamp()
        });
        addLog(`✓ ${emp.legajo} — ${emp.nombre}`, "ok");
        ok++;
      } catch(e) {
        addLog(`✗ Error en ${emp.nombre}: ${e.message}`, "err");
        err++;
      }
    }
    addLog(`\n¡Listo! ${ok} empleados cargados. ${err > 0 ? err + " errores." : "Sin errores."}\nYa podés cerrar esta pestaña.`, "ok");
  } catch(e) {
    addLog("✗ Error de login: " + e.message, "err");
    document.getElementById("btnCargar").disabled = false;
  }
});
